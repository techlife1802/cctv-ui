####################
# API
####################
api: yes
apiAddress: :8557

####################
# Authentication
####################
authMethod: internal
authInternalUsers:
  - user: admin
    pass: admin
    permissions:
      - action: api
      - action: publish

  - user: any
    permissions:
      - action: read

####################
# Logging
####################
logLevel: debug
logDestinations: [stdout]

####################
# Protocols
####################
rtsp: yes
rtspAddress: :8554
readTimeout: 60s
writeTimeout: 60s

rtmp: yes
rtmpAddress: :1935

hls: yes
hlsAddress: :8888
hlsAllowOrigin: "*"
hlsVariant: lowLatency
hlsSegmentDuration: 2s
hlsPartDuration: 400ms
hlsSegmentCount: 7
hlsDirectory: /dev/shm/hls

webrtc: yes
webrtcAddress: :8889
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

pathDefaults:
  sourceProtocol: tcp
  sourceOnDemand: yes
  sourceOnDemandStartTimeout: 30s
  sourceOnDemandCloseAfter: 5m

paths:
  # Paths ending with _audio: receive transcoded streams.
  # We add timestamp repair flags (-use_wallclock_as_timestamps 1 -fflags +genpts+igndts)
  # to fix non-monotonic DTS and unset timestamps. This ensures HLS player (hls.js)
  # receives clean, synchronized video/audio packets and successfully renders the video.
  "~^.*_audio$":
    sourceOnDemand: no
    runOnDemand: >-
      sh -c 'ffmpeg -y -use_wallclock_as_timestamps 1 -fflags +genpts+igndts -rtsp_transport tcp -i rtsp://admin:admin@localhost:8554/$(echo $MTX_PATH | sed s/_audio//) -c:v copy -c:a libopus -b:a 48k -ac 1 -f rtsp -rtsp_transport tcp rtsp://admin:admin@localhost:8554/$MTX_PATH'
    runOnDemandRestart: yes
