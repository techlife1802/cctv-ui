events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        # WebRTC WHEP endpoint (matches /streamName/whep)
        # We look for paths ending in /whep and proxy to MediaMTX WebRTC port
        location ~ /whep$ {
            proxy_pass http://mediamtx:8889;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # Timeouts for WHEP SDP exchange
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # HLS and everything else defaults to MediaMTX HLS/HTTP port
        location / {
            proxy_pass http://mediamtx:8888;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Websocket support for low-latency HLS
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Don't buffer HLS segments — stream them through
            proxy_buffering off;
        }
    }
}
